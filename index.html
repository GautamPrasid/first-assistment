<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Something is Cooking...</title>
  </head>
  <body>
    <div class="container">
      <span class="icon">💀</span>

      <h1>Something is cooking...</h1>
      <p>
        Welcome to our website! It's live but currently under construction. Our
        virtual kitchen is busy cooking something amazing, and we’ll be serving
        it to you very soon. Stay tuned for the full launch!"
      </p>

      <div class="button-wrapper">
        <button id="mischievous-button" onclick="showAlert()">
          click me!
        </button>
      </div>

      <div class="social-media">
        <p style="margin: 0; font-size: 0.9rem">Follow our progress:</p>
        <a
          href="https://github.com/Prashidgautam"
          data-aos="fade-up"
          data-aos-duration="1500"
          data-aos-delay="1300"
          ><i class="fa-brands fa-github"></i
        ></a>
        <a
          href="https://www.facebook.com/prashidgautam/"
          data-aos="fade-up"
          data-aos-duration="1500"
          data-aos-delay="1400"
          ><i class="fa-brands fa-facebook"></i
        ></a>
        <a
          href="https://www.instagram.com/user_on_break__/"
          data-aos="fade-up"
          data-aos-duration="1500"
          data-aos-delay="1500"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a
          href="https://x.com/prasid222"
          data-aos="fade-up"
          data-aos-duration="1500"
          data-aos-delay="1600"
          ><i class="fa-brands fa-twitter"></i
        ></a>
        <a
          href="https://www.youtube.com/@prasid22"
          data-aos="fade-up"
          data-aos-duration="1500"
          data-aos-delay="1600"
          ><i class="fa-brands fa-youtube"></i
        ></a>
      </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="script.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
